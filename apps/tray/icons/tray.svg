<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The Fornax queue: three stacked jobs. scripts/icons.mjs fills in {{glyph}} (the state colour), {{dot}} and
       {{dotOpacity}} (the orange badge: jobs wait while the worker stands). The ring around the badge is cut out, so
       the icon works on any taskbar colour. -->
  <defs>
    <mask id="cut">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="25" cy="7" r="7.5" fill="#000" opacity="{{dotOpacity}}"/>
    </mask>
  </defs>
  <g fill="{{glyph}}" mask="url(#cut)">
    <rect x="3" y="4" width="26" height="7" rx="2.5"/>
    <rect x="3" y="13" width="26" height="7" rx="2.5"/>
    <rect x="3" y="22" width="26" height="7" rx="2.5"/>
  </g>
  <circle cx="25" cy="7" r="5.5" fill="{{dot}}" opacity="{{dotOpacity}}"/>
</svg>
