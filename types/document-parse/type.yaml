name: document-parse
version: 2
description: >-
  Turn a document into Markdown and Docling JSON: PDF, DOCX, XLSX, PPTX, HTML, CSV, Markdown, or an image (scan,
  photo, screenshot). Text-layer PDFs and Office files are read exactly, with tables; images and PDFs without a text
  layer go through OCR on the GPU (PaddleOCR-VL, about 3 GB). The outputs are document.md and document.json; with
  blocks, also blocks.json with the words OCR was unsure of marked.
inputs:
  document:
    extensions: [.pdf, .docx, .xlsx, .pptx, .html, .htm, .csv, .md, .png, .jpg, .jpeg, .webp, .tif, .tiff, .bmp]
    max_mb: 200
params:
  type: object
  additionalProperties: false
  properties:
    ocr:
      enum: [auto, always]
      default: auto
      description: >-
        auto reads a PDF's text layer and uses OCR only where there is none; always reads every PDF page as an image
        (for PDFs whose text layer is garbled).
    blocks:
      type: boolean
      default: false
      description: >-
        Also blocks.json: the paragraphs of an image or PDF read by OCR, each with its words' confidence and the
        uncertain words marked [[like this]], for a human check. A PDF goes through OCR. The language of a block is not
        detected.
    min_confidence:
      type: number
      minimum: 0
      maximum: 1
      default: 0.85
      description: With blocks, a word below this confidence is marked uncertain.
max_runtime: 3h
tools: [python]
setup: ["{tool.python}", "{pack}/scripts/setup.py"]
check: ["{python}", "{pack}/scripts/check.py"]
run: ["{python}", "{pack}/scripts/run.py", "--params", "{params_json}", "--document", "{input.document}",
      "--out", "{out}", "--work", "{work}"]
